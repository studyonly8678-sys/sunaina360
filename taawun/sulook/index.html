<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قضايا المحقق – درس التعاون</title>
<link rel="stylesheet" href="../common.css">
<style>
body{background:radial-gradient(circle at 50% 40%,#1d4f7a,#0c2440 75%);color:#fff}
body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(120,220,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,220,255,.07) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.radar{position:fixed;right:24px;top:24px;width:130px;height:130px;border-radius:50%;border:3px solid #47e5a0;background:radial-gradient(transparent 30%,rgba(71,229,160,.08) 31%,transparent 33%,transparent 63%,rgba(71,229,160,.12) 64%,transparent 66%);overflow:hidden;box-shadow:0 0 22px rgba(71,229,160,.4)}
.radar:before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(71,229,160,.75),transparent 70deg);animation:rot 2.2s linear infinite;border-radius:50%}
.radar i{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd23f;box-shadow:0 0 10px #ffd23f;animation:blink 1.1s infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.2}}
#intro .title{font-size:76px;color:#ffd23f;text-shadow:0 5px 0 #a87400,0 0 30px rgba(255,210,63,.5)}
#intro .sub{font-size:28px;font-weight:900;margin:8px 0 24px;color:#d8f3ff}
.mascot .bubble{color:#22313f}
#play{justify-content:flex-start;padding-top:20px}
.hud{display:flex;gap:18px;align-items:center;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 22px;font-size:24px;font-weight:900}
.dots{display:flex;gap:6px}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);display:block}
.dots i.ok{background:#47e5a0}.dots i.bad{background:#ff8f8f}.dots i.now{background:#ffd23f;animation:blink 1s infinite}
.case{position:relative;margin-top:14px;width:min(780px,92vw);background:#fff;border-radius:26px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.case .ph{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1.18;max-height:50vh;width:100%;background:#eee}
.case img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.case .lens{position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0 90px,rgba(12,36,64,.82) 92px);transition:opacity .7s;pointer-events:none}
.case.seen .lens{opacity:0}
.case .cap{font-family:'Lalezar';font-size:36px;color:#16324f;text-align:center;padding:10px 6px 2px;line-height:1.3}
.case .num{position:absolute;top:-16px;right:-16px;background:#ffd23f;color:#5a3d00;font-family:'Lalezar';font-size:28px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #a87400}
.stampO{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.stamp{font-family:'Lalezar';font-size:56px;padding:6px 28px;border:8px solid;border-radius:18px;transform:rotate(-12deg);background:rgba(255,255,255,.85);white-space:nowrap;animation:spinIn .35s cubic-bezier(.3,1.6,.5,1) both}
.stamp.g{color:#169b55;border-color:#169b55}.stamp.r{color:#d7263d;border-color:#d7263d}
.choices{display:flex;gap:28px;margin:18px 0 8px}
.why{display:none;align-items:flex-end;gap:10px;margin-top:6px}
.why.on{display:flex;animation:fadeIn .4s}
.why img{width:90px}
.why .bubble{font-size:23px}
#nextBtn{display:none;align-self:center;margin-right:10px;font-size:26px}
/* النهاية */
.board{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(1000px,94vw);margin:10px 0}
.col{background:rgba(255,255,255,.1);border-radius:20px;padding:12px;border:3px solid}
.col.g{border-color:#47e5a0}.col.r{border-color:#ff8f8f}
.col h3{font-family:'Lalezar';font-size:30px;text-align:center;margin-bottom:8px}
.col .mini{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.col .mini div{width:calc(50% - 8px);background:#fff;color:#16324f;border-radius:12px;overflow:hidden;font-weight:900;font-size:16px;text-align:center;animation:pop .5s both}
.col .mini img{width:100%;aspect-ratio:2;object-fit:cover;display:block}
.col .mini span{display:block;padding:4px}
#end h2{font-size:44px;color:#ffd23f}
#end{justify-content:flex-start;padding-top:12px;overflow-y:auto}
.board{margin:6px 0}
.badge{display:flex;align-items:center;gap:16px;background:#fffdf3;color:#5a3d00;border-radius:24px;padding:10px 26px;border:6px double #e0b13c}
.badge img{width:90px}
.badge b{font-family:'Lalezar';font-size:34px}
</style>
</head>
<body>
<div class="radar"><i style="top:30%;left:62%"></i><i style="top:66%;left:28%;animation-delay:.5s"></i></div>

<section class="screen on" id="intro">
  <h1 class="title">🕵️ قضايا المحقق</h1>
  <p class="sub">يا محققي الفصل! الرادار التقط ثمانية مواقف… أيُّها سلوكٌ تعاوني؟</p>
  <div class="mascot"><img src="../img/ant_think.png" alt="المحققة نملة"><div class="bubble">انظروا إلى الصورة جيدًا 🔍 ثم احكموا:<br><b style="color:#169b55">تعاوني</b> أم <b style="color:#d7263d">غير تعاوني</b>؟ ولا تنسوا: <b>لماذا؟</b></div></div>
  <button class="btn3d gold" style="margin-top:26px" id="startBtn">🔍 ابدأ التحقيق</button>
</section>

<section class="screen" id="play">
  <div class="hud"><span>🗂️ الموقف <b id="cnt">1</b> / 8</span><div class="dots" id="dots"></div><span>✅ <b id="sc">0</b></span></div>
  <div class="case" id="case">
    <div class="num" id="num">1</div>
    <div class="ph" id="ph"><img id="img" alt=""><div class="lens"></div><div class="stampO" id="stampO"></div></div>
    <div class="cap" id="cap"></div>
  </div>
  <div class="choices" id="choices">
    <button class="btn3d green" id="yesBtn">🤝 سلوكٌ تعاوني</button>
    <button class="btn3d red" id="noBtn">🚫 غيرُ تعاوني</button>
  </div>
  <div class="why" id="why"><img src="../img/ant_point.png" alt=""><div class="bubble" id="whyTxt"></div><button class="btn3d blue" id="nextBtn">الموقفُ التالي ⬅</button></div>
</section>

<section class="screen" id="end">
  <h2>🕵️ أُغلقت القضايا كلها!</h2>
  <div class="board">
    <div class="col g"><h3>🤝 سلوكيات تعاونية</h3><div class="mini" id="colG"></div></div>
    <div class="col r"><h3>🚫 سلوكيات غير تعاونية</h3><div class="mini" id="colR"></div></div>
  </div>
  <div class="badge"><img id="medal" src="../img/st_gold.png" alt=""><div><b>شارة المحقق الذكي</b><br><span id="endTxt" style="font-size:22px;font-weight:900"></span></div></div>
  <button class="btn3d blue" onclick="location.reload()" style="margin-top:16px">↺ تحقيقٌ جديد</button>
</section>

<script src="../common.js"></script>
<script>
T.topbar();
var CASES=[
 {img:'b1',t:'أساعدُ أمي في ترتيب المائدة',y:1,w:'نتشاركُ عملَ البيت فننجزه بسرعة، وتفرحُ أمي.'},
 {img:'b2',t:'ألعبُ بينما زملائي ينظّفون الفصل',y:0,w:'تركتُ زملائي يتعبون وحدَهم، ولم أشاركهم العمل.'},
 {img:'b3',t:'نحملُ أغراضَ جارِنا المسنّ معًا',y:1,w:'نساعدُ من يحتاجُ إلى العون، وللجارِ حقٌّ علينا.'},
 {img:'b4',t:'أرفضُ مشاركةَ أدواتي مع مجموعتي',y:0,w:'لم أُعِن مجموعتي، فتأخّر عملُنا جميعًا.'},
 {img:'b6',t:'نزورُ جدّتنا المريضة مع أقاربنا',y:1,w:'تعاونّا على الخير، فانتشرت المحبةُ وفرحت جدّتنا.'},
 {img:'b5',t:'أساعدُ صديقي على الغشّ في الاختبار',y:0,w:'هذا تعاونٌ على الخطأ! أمرنا اللهُ أن نتعاون على البرّ لا على الإثم.'},
 {img:'a4',t:'نقسّمُ أدواتِ المشروع ويُتقنُ كلُّ واحدٍ دورَه',y:1,w:'كلُّ واحدٍ يقوم بدوره، فيكتملُ العملُ ويُتقَن.'},
 {img:'a6',t:'نكتبُ معًا على جدار المدرسة',y:0,w:'اجتمعنا على عملٍ يُفسد مدرستنا، وهذا ليس تعاونًا محمودًا.'}
];
var k=0,score=0,tries=0,res=[],busy=false;
function start(){ k=0;score=0;res=[]; var d=T.$('#dots');d.innerHTML='';CASES.forEach(function(){d.appendChild(document.createElement('i'))}); T.show('play'); load(); }
function load(){
  busy=false; tries=0; var c=CASES[k], cs=T.$('#case');
  cs.classList.remove('seen'); T.$('#img').src='../img/'+c.img+'.jpg'; T.$('#cap').textContent=c.t;
  T.$('#num').textContent=k+1; T.$('#cnt').textContent=k+1; T.$('#stampO').innerHTML='';
  T.$('#why').classList.remove('on'); T.$('#nextBtn').style.display='none'; T.$('#choices').style.display='';
  [].forEach.call(T.$('#dots').children,function(e,i){ e.className=i<k?(res[i]?'ok':'bad'):(i===k?'now':''); });
  T.restart(cs,'pop'); T.play('whoosh'); scan();
}
/* عدسة المحقق تتجول ثم تكشف الصورة */
function scan(){
  var ph=T.$('#ph'),t0=performance.now(),dur=1600;
  (function f(t){ var p=(t-t0)/dur; ph.style.setProperty('--x',(20+60*Math.abs(Math.sin(p*3)))+'%'); ph.style.setProperty('--y',(30+40*p)+'%');
    if(p<1&&T.$('#play').classList.contains('on')) requestAnimationFrame(f); else { T.$('#case').classList.add('seen'); T.play('tick'); } })(t0);
}
function answer(yes){
  if(busy) return; var c=CASES[k]; T.$('#case').classList.add('seen');
  if((yes?1:0)===c.y){
    busy=true; if(tries===0) score++; res[k]=tries===0; T.$('#sc').textContent=score;
    T.play('stamp'); setTimeout(function(){T.play('correct')},180);
    T.$('#stampO').innerHTML='<div class="stamp '+(c.y?'g':'r')+'">'+(c.y?'✔ تعاوني':'✖ غير تعاوني')+'</div>';
    T.$('#choices').style.display='none';
    T.$('#whyTxt').innerHTML='<b>لماذا؟</b> '+c.w; T.$('#why').classList.add('on');
    T.$('#nextBtn').style.display='inline-block'; T.$('#nextBtn').textContent=k<CASES.length-1?'الموقفُ التالي ⬅':'📁 أغلقوا الملف';
    if(c.y) T.confetti(40);
  }else{
    tries++; T.play('wrong'); T.restart(T.$('#case'),'shake');
    T.$('#whyTxt').innerHTML='🤔 فكّروا مرة أخرى: هل يساعدُ هذا السلوكُ غيرَنا على الخير؟'; T.$('#why').classList.add('on');
  }
}
function next(){ k++; if(k<CASES.length) load(); else end(); }
function end(){
  T.show('end'); T.play('fanfare'); T.confetti(220);
  var g=T.$('#colG'),r=T.$('#colR'); g.innerHTML='';r.innerHTML='';
  CASES.forEach(function(c,i){ var d=document.createElement('div'); d.style.animationDelay=(i*.12)+'s'; d.innerHTML='<img src="../img/'+c.img+'.jpg" alt=""><span>'+c.t+'</span>'; (c.y?g:r).appendChild(d); });
  T.$('#endTxt').textContent='ميّزتم '+score+' من 8 مواقف من المحاولة الأولى';
  T.$('#medal').src='../img/'+(score>=7?'st_gold':score>=5?'st_silver':'st_bronze')+'.png';
}
T.$('#startBtn').onclick=start; T.$('#yesBtn').onclick=function(){answer(true)}; T.$('#noBtn').onclick=function(){answer(false)}; T.$('#nextBtn').onclick=next;
T.$('#cap').onclick=function(){T.say(this.textContent)};
document.addEventListener('keydown',function(e){ if(!T.$('#play').classList.contains('on'))return; if(e.key==='ArrowRight'||e.key==='1')answer(true); if(e.key==='ArrowLeft'||e.key==='2')answer(false); if(e.key==='Enter'&&T.$('#nextBtn').style.display!=='none')next(); });
</script>
</body>
</html>
