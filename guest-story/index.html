<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>ضيفٌ في بيتنا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: a storybook "page" — picture on one side, text on the other; stacks on phones. Single deliberate look (warm Bahraini home). */
:root{
  --ground:#0F4C5C;      /* deep sea teal around the book */
  --paper:#FFF6E3;       /* page */
  --ink:#24203A;
  --teal:#1B8A9A;
  --red:#C8102E;         /* Bahrain red */
  --gold:#E9A92C;
  --green:#23845A;
  --muted:#6E6457;
  --line:#E5D3AE;
  --display:'Lalezar','Noto Naskh Arabic',system-ui,sans-serif;
  --body:'Noto Naskh Arabic','Geeza Pro','Tahoma',serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0);background-size:22px 22px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
.app{max-width:1400px;margin:0 auto;padding-block:14px;display:flex;flex-direction:column;gap:12px;height:100%;box-sizing:border-box}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#fff}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--body);font-weight:700;font-size:17px;border:0;border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.btn.primary{background:var(--red);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:20px;height:20px;flex:none}
.stars{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-weight:700;min-height:32px}
.stars svg{width:22px;height:22px}

.book{background:var(--paper);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden;position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.book>*{flex:1;min-height:0}
.quiz,.end{overflow:auto}
.page{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:0}
.pic{position:relative;overflow:hidden;background:#3a2c22;min-height:0;border-left:6px solid var(--paper)}
.pic .bg{filter:blur(18px) brightness(.85);transform:scale(1.15)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pic img.bg{object-fit:cover}
.txt{padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:0;min-width:0;min-height:0;overflow:auto;cursor:pointer}
.prog{font-size:15px;font-weight:700;color:var(--muted);margin-top:10px;display:flex;gap:6px;align-items:center}
.prog i{width:26px;height:6px;border-radius:3px;background:var(--line);display:inline-block}
.prog i.on{background:var(--teal)}
.lines{display:flex;flex-direction:column;margin-top:14px}
.lines p{padding:10px 14px;border-radius:14px;margin:4px 0;transition:background .4s,color .4s}
.lines p.past{color:#7C7266}
.lines p.past b{color:#5E8C93}
.lines p.cur{background:#FFF0C9;box-shadow:0 0 0 2px #F2CF86 inset;animation:rise .6s ease both}
.chip{align-self:flex-start;box-shadow:0 3px 0 #0E6672;font-family:var(--display);font-size:30px;color:#fff;background:var(--teal);padding:2px 22px 4px;border-radius:999px}
.txt p{margin:0;font-size:clamp(20px,1.75vw,27px);line-height:1.85;font-weight:500;text-wrap:pretty}
.txt p b{color:#13606D}
.num{position:absolute;top:14px;right:16px;z-index:2;width:42px;height:42px;border-radius:50%;background:var(--teal);color:#fff;font-family:var(--display);font-size:22px;display:flex;align-items:center;justify-content:center}

/* question box */
.q{grid-column:1/-1;margin:16px 18px 18px;border:3px dashed var(--gold);border-radius:18px;padding:12px 18px;background:#FFF0C9;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 18px;align-items:center}
.q h3,.q .stem{grid-column:1}
.q .opts{grid-column:2;grid-row:1/span 2}
.q .fb{grid-column:1/-1;min-height:0}
.q h3 svg{width:26px;height:26px;flex:none}
.q h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:#9A5B00;display:flex;align-items:center;gap:8px}
.q .stem{font-size:20px;font-weight:700;line-height:1.7}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1 1 180px;font-family:var(--body);font-size:19px;font-weight:700;padding:10px 14px;min-height:48px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:center}
.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.opt.ok{border-color:var(--green);background:#E3F5EA}
.opt.no{border-color:var(--red);background:#FDE7EA;animation:shake .4s}
.fb{font-size:18px;font-weight:700;min-height:1.6em}
.fb.ok{color:var(--green)} .fb.no{color:var(--red)}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3)}
.dot.on{background:var(--gold)}

/* cover */
.cover{position:relative;min-height:560px;display:flex}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,246,227,.92) 0%,rgba(255,246,227,.55) 32%,rgba(255,246,227,0) 55%)}
.cover .ct{position:relative;margin:0 auto;padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.cover h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(54px,9vw,96px);line-height:1.1;color:var(--red);text-wrap:balance}
.cover .sub{font-size:22px;font-weight:700}
.cover .meta{position:absolute;bottom:18px;right:18px;left:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 14px;font-size:16px;font-weight:700;line-height:1.6}
.start{font-size:24px;padding:12px 28px;min-height:56px}

/* animations */
.pic img.kb{animation:kb 1.6s ease-out both}
@keyframes kb{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
.reveal{animation:rise .7s ease both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fx{position:absolute;pointer-events:none;font-family:var(--display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.35)}
.fx.pop{animation:pop 1.1s ease both;animation-delay:var(--d,0s)}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}40%{opacity:1;transform:scale(1.15) rotate(3deg)}100%{opacity:1;transform:scale(1)}}
.fx.float{animation:float 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes float{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.bubble{position:absolute;background:#fff;color:var(--ink);font-family:var(--display);font-size:24px;padding:6px 18px 8px;border-radius:20px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:pop .9s ease both;animation-delay:var(--d,0s)}
.bubble::after{content:"";position:absolute;bottom:-12px;left:30px;border:8px solid transparent;border-top:14px solid #fff}
.bubble.still{animation:none}
.bubble.up::after{bottom:auto;top:-20px;border-top:8px solid transparent;border-bottom:14px solid #fff}
@media (max-width:820px){.bubble{font-size:18px;padding:4px 12px 6px}}

/* summative */
.quiz{padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.quiz h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--red)}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.lvl{border-radius:18px;border:3px solid var(--line);background:#fff;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lvl h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;display:flex;align-items:center;gap:8px}
.lvl .ins{font-size:17px;font-weight:700;line-height:1.7;background:#FFF0C9;border-radius:10px;padding:6px 10px}
.lvl.l1{border-color:#9CCFB4} .lvl.l1 h3{color:var(--green)}
.lvl.l2{border-color:#F2CF86} .lvl.l2 h3{color:#9A5B00}
.lvl.l3{border-color:#F0A3AE} .lvl.l3 h3{color:var(--red)}
.row{display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:1.7;border-bottom:1px dashed var(--line);padding-bottom:8px}
.row:last-child{border-bottom:0}
.tf{display:flex;gap:8px}
.tf button,.mc button{font-family:var(--body);font-weight:700;font-size:17px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;padding:4px 12px;color:var(--ink)}
.tf button{flex:1}
.mc{display:flex;flex-direction:column;gap:6px}
.tf button[aria-pressed="true"],.mc button[aria-pressed="true"]{border-color:var(--teal);background:#DDF1F4}
.row.good{background:#EAF7EF;border-radius:10px;padding:6px 8px}
.row.bad{background:#FBE0E3;border:3px solid #8B0F1C;border-radius:12px;padding:6px 8px}
.row.bad>div:first-child{color:#8B0F1C;font-weight:700}
.row.bad>div:first-child::before{content:"✗ ";font-weight:700}
.lvl input.bad{border:3px solid #8B0F1C;background:#FBE0E3;color:#8B0F1C;font-weight:700}
.lvl input.good{border-color:var(--green);background:#EAF7EF}
.lvl input{font-family:var(--body);font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);width:100%;box-sizing:border-box;min-height:44px}
.lvl input:focus-visible{outline:3px solid var(--teal)}
.check{align-self:flex-start}
.res{font-weight:700;font-size:17px;min-height:1.6em}
.self{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.faces{display:flex;gap:12px;flex-wrap:wrap}
.face{flex:1 1 160px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;font-family:var(--body);font-size:17px;font-weight:700;color:var(--ink);min-height:44px}
.face svg{width:54px;height:54px}
.face[aria-pressed="true"]{border-color:var(--gold);background:#FFF0C9}
.end{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.end h2{margin:0;font-family:var(--display);font-weight:400;font-size:56px;color:var(--red)}
.end p{margin:0;font-size:22px;font-weight:700;max-width:640px;line-height:1.8}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:58px;height:58px}

@media (max-width:820px){
  .app{height:auto;min-height:100%}
  .book>*{flex:none}
  .page{grid-template-columns:1fr;grid-template-rows:auto}
  .pic{aspect-ratio:3/2;height:auto}
  .txt{overflow:visible}
  .pic{border-left:0}
  .q{grid-template-columns:1fr}
  .q .opts{grid-column:1;grid-row:auto}
  .pic{aspect-ratio:3/2;min-height:0;max-width:100%}
  .txt p{font-size:20px}
  .lvls{grid-template-columns:1fr}
  .cover{min-height:480px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <div class="bar">
    <div class="brand">ضيفٌ في بيتنا</div>
    <div class="tools">
      <div class="stars" aria-label="عدد النجوم"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.1.7-5.3 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L1.9 9.3 9 8.6z" fill="#E9A92C"/></svg><span id="starCount">٠</span></div>
      <button class="btn ghost" id="sndBtn" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg><span>الأصوات: تعمل</span></button>
      <button class="btn ghost" id="fsBtn" type="button" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" fill="none"/></svg>ملء الشاشة</button>
    </div>
  </div>

  <div class="book" id="book"></div>

  <div class="nav">
    <button class="btn" id="prevBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>السابق</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="btn primary" id="nextBtn" type="button">التالي<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" fill="none"/></svg></button>
  </div>
</div>

<script>
(function(){
/* ---------- content ---------- */
const PAGES = [
 {type:'cover', img:'img/p0.jpg'},
 {title:'خبرٌ سعيد', img:'img/p1.jpg', sound:'birds',
  text:['في صباحِ يومِ الجمعة، قالَ الجدُّ: <b>«اليومَ يزورُنا صديقي القديمُ العمُّ أبو راشد.»</b>',
        'فرحَ سلمانُ وسأل: <b>«وماذا سنفعلُ يا جدّي؟»</b>',
        'ابتسمَ الجدُّ وقال: <b>«سترى بنفسِك يا سلمان.»</b>'],
  fx:[{cls:'fx float',txt:'♪',x:'14%',y:'18%',size:30,d:'.4s'},{cls:'fx float',txt:'♪',x:'24%',y:'12%',size:24,d:'1.4s'}]},
 {title:'نستعدُّ للضيف', img:'img/p2.jpg', sound:'prepare',
  text:['نظّفَت الأسرةُ المجلس، ورتّبَت نورةُ الوسائد، وأعدّت الأمُّ القهوةَ والطعام.',
        'ولبسَ سلمانُ ثوبَه النظيف، وجلسَ ينتظرُ الضيف.'],
  fx:[{cls:'fx pop',txt:'✦',x:'20%',y:'20%',size:34,d:'.8s'},{cls:'fx pop',txt:'✦',x:'70%',y:'30%',size:26,d:'1.3s'},{cls:'fx pop',txt:'✦',x:'45%',y:'14%',size:30,d:'1.8s'}]},
 {title:'طَق طَق طَق!', img:'img/p3.jpg', sound:'knock',
  text:['قبلَ الظهر، طُرِقَ الباب: <b>طَق.. طَق.. طَق!</b>',
        'ركضَ سلمانُ مع أبيه ليفتحا الباب.'],
  fx:[{cls:'fx pop',txt:'طَق',x:'12%',y:'22%',size:40,d:'.6s'},{cls:'fx pop',txt:'طَق',x:'22%',y:'36%',size:40,d:'.95s'},{cls:'fx pop',txt:'طَق!',x:'10%',y:'50%',size:44,d:'1.3s'}]},
 {title:'أهلًا وسهلًا', img:'img/p4.jpg', sound:'door',
  text:['فتحَ الأبُ البابَ وقالَ مبتسمًا: <b>«حيّاكَ اللهُ يا أبا راشد، تفضّل!»</b>',
        'وصافحَه سلمانُ وقال: <b>«أهلًا وسهلًا يا عمّ.»</b>',
        'ثمّ أدخلاه المجلس، وأجلساه في أفضلِ مكان.'],
  bubble:{txt:'حيّاكَ الله، تفضّل!',x:'3%',b:'5%',d:'1s'},
  q:{stem:'ماذا فعلت أسرة سلمان عندما وصل الضيف؟', opts:['تركته ينتظر عند الباب','رحّبت به'], ans:1}},
 {title:'فنجانُ القهوة', img:'img/p5.jpg', sound:'coffee',
  text:['حملَ الجدُّ الدلّة، وصبَّ القهوةَ في الفنجان.',
        'وقدّمَه سلمانُ للضيفِ بيدِه اليمنى.',
        'قالَ العمُّ أبو راشد: <b>«سلمَت يداك يا بطل!»</b>'],
  fx:[{cls:'fx float',txt:'〰',x:'48%',y:'36%',size:28,d:'1.8s'},{cls:'fx float',txt:'〰',x:'52%',y:'32%',size:24,d:'2.6s'}],
  q:{stem:'بماذا أكرم الجدّ ضيفه بعد أن جلس؟', opts:['قدّم له القهوة','انشغل عنه بالهاتف'], ans:0}},
 {title:'حكاياتُ الماضي', img:'img/p6.jpg', sound:'tune',
  text:['جلسوا في المجلسِ يتبادلونَ الأخبار.',
        'وحكى العمُّ أبو راشد حكاياتٍ جميلةً عن البحرينِ في الماضي، وسلمانُ يستمعُ بانتباه.']},
 {title:'الغداءُ جاهز', img:'img/p7.jpg', sound:'plates',
  text:['نادَت الأمُّ: <b>«الغداءُ جاهز!»</b>',
        'وضعَت الأسرةُ أطباقَ الطعامِ أمامَ الضيف، وكان الأبُ يقدّمُ له أطيبَ الطعام، وسلمانُ يقرّبُ له الماء.'],
  fx:[{cls:'fx float',txt:'〰',x:'40%',y:'44%',size:28,d:'1s'},{cls:'fx float',txt:'〰',x:'46%',y:'40%',size:24,d:'1.8s'}],
  q:{stem:'كيف أكرمت الأسرة ضيفها على الغداء؟', opts:['أطعمته وقامت على خدمته','أكلت قبله وتركته'], ans:0}},
 {title:'شكرًا لكم', img:'img/p8.jpg', sound:'farewell',
  text:['بعدَ الغداء، شكرَهم العمُّ أبو راشد وقال: <b>«جزاكمُ اللهُ خيرًا على كرمِكم.»</b>',
        'ثمّ ودّعَه الجدُّ وسلمانُ حتى الباب.'],
  bubble:{txt:'جزاكمُ اللهُ خيرًا',x:'28%',y:'3%',d:'1s'}},
 {title:'سلمانُ يتعلّم', img:'img/p9.jpg', sound:'warm',
  text:['سألَ سلمانُ جدَّه: <b>«لماذا نفعلُ كلَّ هذا للضيف؟»</b>',
        'قالَ الجدّ: <b>«إكرامُ الضيفِ من عاداتِنا الحميدةِ التي توارثَها مجتمعُنا البحرينيّ، وقالَ رسولُ اللهِ ﷺ: "مَن كانَ يؤمنُ باللهِ واليومِ الآخرِ فليُكرِمْ ضيفَه".»</b>',
        'قالَ سلمان: <b>«سأُكرِمُ ضيوفي دائمًا مثلَك يا جدّي.»</b>'],
  fx:[{cls:'fx float',txt:'♥',x:'30%',y:'30%',size:30,d:'.8s'},{cls:'fx float',txt:'♥',x:'60%',y:'26%',size:24,d:'1.6s'},{cls:'fx float',txt:'♥',x:'45%',y:'20%',size:28,d:'2.4s'}]},
 {type:'quiz'},
 {type:'end'}
];
const QUIZ = {
 tf:[{s:'زارَ العمُّ أبو راشد أسرةَ سلمانَ يومَ الجمعة.',a:true},
     {s:'فتحَ سلمانُ وأبوه البابَ للضيف.',a:true},
     {s:'أجلسَت الأسرةُ الضيفَ عندَ الباب.',a:false},
     {s:'أكلَت الأسرةُ الغداءَ قبلَ الضيف.',a:false}],
 mc:[{s:'ماذا قالَ الأبُ للضيفِ عندما فتحَ الباب؟',o:['«مع السلامة»','«حيّاكَ اللهُ، تفضّل»','«انتظرْ قليلًا»'],a:1},
     {s:'ماذا حملَ الجدُّ في المجلس؟',o:['الدلّة','الكتاب','الهاتف'],a:0},
     {s:'ماذا قرّبَ سلمانُ للضيفِ على الغداء؟',o:['الألعاب','الماء','الحقيبة'],a:1}]
};
const AR = n => String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.1.7-5.3 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L1.9 9.3 9 8.6z" fill="#E9A92C"/></svg>';

/* ---------- state ---------- */
let idx = 0, stars = 0, soundOn = true;
let step = {};
function advance(){ const p=PAGES[idx]; if(!p.text) return false; const n=p.text.length, st=step[idx]||1; if(st<n){ step[idx]=st+1; render(); return true; } return false; }
function forward(){ if(nextBtn.disabled||nextBtn.hidden) return; if(idx===0) ctx(); if(advance()) return; go(idx+1); }
const answered = {};
const book = document.getElementById('book');
const prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
const dots = document.getElementById('dots');
PAGES.forEach(()=>{const d=document.createElement('span');d.className='dot';dots.appendChild(d)});

/* ---------- sound engine (synthesised, no files) ---------- */
let ac=null, master=null, nb=null;
function ctx(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
    nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const ch=nb.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }catch(e){ return null; } }
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function tone(f,t,dur,type,vol,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,.01,vol||.2,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1);}
function noise(t,dur,type,freq,vol,q,freq2){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(freq2)f.frequency.linearRampToValueAtTime(freq2,t+dur);f.Q.value=q||1;const g=ac.createGain();env(g,t,.02,vol,dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.1);}
const pluck=(f,t,v)=>{tone(f,t,.9,'triangle',v||.16);tone(f*2,t,.4,'sine',(v||.16)*.3);};
const SFX={
  birds(){const n=ac.currentTime;for(let i=0;i<9;i++){const t=n+.3+i*.42+Math.random()*.2;tone(2600+Math.random()*900,t,.07,'sine',.07,4200);tone(3600,t+.09,.06,'sine',.05,2500);}},
  prepare(){const n=ac.currentTime;for(let i=0;i<4;i++)noise(n+.3+i*.45,.3,'highpass',2500,.06);[587,659,698,784].forEach((f,i)=>pluck(f,n+2.1+i*.22,.1));},
  knock(){const n=ac.currentTime+.5;for(let i=0;i<3;i++){const t=n+i*.36;noise(t,.08,'lowpass',450,.9);tone(120,t,.14,'sine',.6,70);}},
  door(){const n=ac.currentTime+.2;const o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(150,n);o.frequency.linearRampToValueAtTime(240,n+1.1);l.frequency.value=22;lg.gain.value=18;l.connect(lg);lg.connect(o.frequency);
    f.type='bandpass';f.frequency.value=900;f.Q.value=4;env(g,n,.1,.07,1.1);o.connect(f);f.connect(g);g.connect(master);o.start(n);l.start(n);o.stop(n+1.3);l.stop(n+1.3);
    [523,659,784].forEach((fq,i)=>tone(fq,n+1.5+i*.12,.5,'triangle',.12));},
  coffee(){const n=ac.currentTime+.6;noise(n,1.8,'bandpass',1100,.16,2.5,2300);tone(2637,n+2.1,.5,'sine',.12);tone(3951,n+2.1,.35,'sine',.06);},
  tune(){const n=ac.currentTime+.3;const m=[587,622,740,784,880,784,740,622,587,523,587];m.forEach((f,i)=>pluck(f,n+i*.38,.14));},
  plates(){const n=ac.currentTime+.4;[0,.35,.8,1.2].forEach((d,i)=>{tone(1700+i*220,n+d,.35,'sine',.09);noise(n+d,.05,'highpass',3000,.08);});},
  farewell(){const n=ac.currentTime+.4;[784,659,587,523].forEach((f,i)=>pluck(f,n+i*.3,.13));noise(n+1.6,.2,'lowpass',300,.6);tone(80,n+1.6,.2,'sine',.4);},
  warm(){const n=ac.currentTime+.3;[523,659,784,1047,784,880].forEach((f,i)=>pluck(f,n+i*.42,.13));},
  correct(){const n=ac.currentTime;[523,659,784,1047].forEach((f,i)=>tone(f,n+i*.09,.35,'triangle',.18));},
  wrong(){const n=ac.currentTime;tone(330,n,.22,'triangle',.15,240);tone(260,n+.2,.3,'triangle',.12,200);},
  turn(){const n=ac.currentTime;noise(n,.3,'bandpass',500,.08,1,2600);},
  win(){const n=ac.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone(f,n+i*.12,.5,'triangle',.16));}
};
function play(name){ if(!soundOn||!SFX[name]) return; if(!ctx()) return; try{ SFX[name](); }catch(e){} }

/* ---------- read aloud ---------- */
const synth = window.speechSynthesis;
function arVoice(){ try{ return (synth.getVoices()||[]).find(v=>/^ar/i.test(v.lang)); }catch(e){ return null; } }
function stopRead(){ try{ synth && synth.cancel(); }catch(e){} }
(document.getElementById('readBtn')||{addEventListener(){}}).addEventListener('click',()=>{
  if(!synth){ flash('القراءة الصوتية غير متاحة على هذا الجهاز'); return; }
  stopRead();
  const p = PAGES[idx]; if(!p.text){ flash('اختر صفحة من صفحات القصة لأقرأها'); return; }
  const tmp=document.createElement('div'); tmp.innerHTML=p.text.join(' ');
  const u=new SpeechSynthesisUtterance(tmp.textContent.replace(/[«»"]/g,''));
  u.lang='ar-SA'; u.rate=.85; const v=arVoice(); if(v) u.voice=v;
  if(!v) flash('لا يوجد صوت عربي على هذا الجهاز، قد تكون القراءة غير واضحة');
  synth.speak(u);
});
function flash(msg){const f=document.createElement('div');f.textContent=msg;f.setAttribute('role','status');f.style.cssText='position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#24203A;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw;text-align:center';document.body.appendChild(f);setTimeout(()=>f.remove(),2600);}

/* ---------- render ---------- */
function setStars(){document.getElementById('starCount').textContent=AR(stars);}
function render(){
  stopRead();
  const p = PAGES[idx];
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
  prevBtn.disabled = idx===0;
  nextBtn.hidden = p.type==='end';
  if(p.type==='cover') return renderCover();
  if(p.type==='quiz') return renderQuiz();
  if(p.type==='end') return renderEnd();
  const pageNo = idx;
  const fx = (p.fx||[]).map(f=>`<span class="${f.cls}" style="right:${f.x};top:${f.y};font-size:${f.size}px;--d:${f.d}">${f.txt}</span>`).join('');
  const bub = p.bubble?`<div class="bubble${p.bubble.b?' up':''}" style="left:${p.bubble.x};${p.bubble.b?'bottom:'+p.bubble.b:'top:'+p.bubble.y};--d:${p.bubble.d}">${p.bubble.txt}</div>`:'';
  const st = step[idx] || 1; const n = p.text.length;
  const paras = p.text.slice(0,st).map((t,i)=>`<p class="${i===st-1?'cur':'past'}">${t}</p>`).join('');
  const prog = `<div class="prog" aria-label="السطر ${AR(st)} من ${AR(n)}">${p.text.map((_,i)=>`<i class="${i<st?'on':''}"></i>`).join('')}</div>`;
  let q='';
  if(p.q && st>=n){
    const done = answered[idx];
    q = `<div class="q reveal" style="--d:.2s"><h3>${STAR} أتوقّفُ وأستنتج</h3><div class="stem">${p.q.stem}</div>
      <div class="opts">${p.q.opts.map((o,i)=>`<button type="button" class="opt${done&&i===p.q.ans?' ok':''}" data-i="${i}">${o}</button>`).join('')}</div>
      <div class="fb${done?' ok':''}" role="status">${done?'أحسنت! استنتاجٌ صحيح.':''}</div></div>`;
  }
  const fresh = !(book.dataset.page==String(idx));
  book.dataset.page = idx;
  book.innerHTML = `<div class="page"><div class="pic"><img class="bg" src="${p.img}?v=2" alt="" aria-hidden="true"><img class="${fresh?'kb':''}" src="${p.img}?v=2" alt="${p.title}">${fresh?fx+bub:bub.replace('class="bubble','class="bubble still')}<div class="num">${AR(pageNo)}</div></div>
    <div class="txt" id="txt" title="اضغط لإكمال القراءة"><div class="chip">${p.title}</div>${prog}<div class="lines">${paras}</div></div>${q}</div>`;
  document.getElementById('txt').addEventListener('click',e=>{ if(!e.target.closest('button')) advance(); });
  if(p.q && st>=n){
    book.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      if(answered[idx]) return;
      const i=+b.dataset.i, fb=book.querySelector('.fb');
      if(i===p.q.ans){ b.classList.add('ok'); fb.className='fb ok'; fb.textContent='أحسنت! استنتاجٌ صحيح.'; answered[idx]=true; stars++; setStars(); play('correct'); updateNext(); }
      else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); fb.className='fb no'; fb.textContent='فكّر مرّةً أخرى، وانظر إلى الصورة.'; play('wrong'); }
    }));
  }
  updateNext();
  if(fresh) play(p.sound); else play('turn');
}
function updateNext(){
  const p=PAGES[idx];
  const reading = p.text && (step[idx]||1) < p.text.length;
  const locked = !reading && p.q && !answered[idx];
  nextBtn.disabled = !!locked;
  nextBtn.firstChild.textContent = reading ? 'أكمل القراءة ' : locked ? 'أجب أوّلًا ' : (p.type==='cover'?'ابدأ ':'الصفحة التالية ');
}
function renderCover(){
  book.innerHTML = `<div class="cover"><img src="${PAGES[0].img}" alt="سلمان وجدّه عند باب البيت"><div class="veil"></div>
   <div class="ct"><h1>ضيفٌ في بيتنا</h1><div class="sub">قصّةٌ تفاعليّة عن إكرامِ الضيفِ في مجتمعِنا البحرينيّ</div>
   <button class="btn primary start" id="startBtn" type="button">ابدأ القصّة</button></div>
   <div class="meta"><div class="tag">التربية للمواطنة – الصف الثالث<br>الدرس الأول: عاداتي وتقاليدي</div></div></div>`;
  document.getElementById('startBtn').addEventListener('click',()=>{ctx();go(1);});
  updateNext();
}
function renderQuiz(){
  const tf = QUIZ.tf.map((r,i)=>`<div class="row" data-k="tf${i}"><div>${AR(i+1)}. ${r.s}</div><div class="tf" role="group" aria-label="صح أو خطأ">
     <button type="button" data-v="1" aria-pressed="false">✓ صح</button><button type="button" data-v="0" aria-pressed="false">✗ خطأ</button></div></div>`).join('');
  const L='أبج';
  const mc = QUIZ.mc.map((r,i)=>`<div class="row" data-k="mc${i}"><div>${AR(i+1)}. ${r.s}</div><div class="mc" role="group">
     ${r.o.map((o,j)=>`<button type="button" data-v="${j}" aria-pressed="false">${L[j]}) ${o}</button>`).join('')}</div></div>`).join('');
  const faces=[['حللتُ المستوياتِ كلَّها','M8 14q4 4 8 0'],['حللتُ مستويين','M8 15h8'],['حللتُ مستوًى واحدًا','M8 16q4-3 8 0']];
  book.innerHTML = `<div class="quiz"><h2>التقويمُ الختاميّ</h2>
   <div class="lvls">
    <section class="lvl l1"><h3>المستوى المتدنّي</h3><div class="ins">ضعْ علامةَ (✓) أمامَ العبارةِ الصحيحة، وعلامةَ (✗) أمامَ العبارةِ الخاطئة:</div>${tf}<button class="btn primary check" type="button" data-l="tf">تحقّقْ من إجاباتي</button><div class="res" id="r_tf" role="status"></div></section>
    <section class="lvl l2"><h3>المستوى المتوسّط</h3><div class="ins">اخترِ الإجابةَ الصحيحة:</div>${mc}<button class="btn primary check" type="button" data-l="mc">تحقّقْ من إجاباتي</button><div class="res" id="r_mc" role="status"></div></section>
    <section class="lvl l3"><h3>المستوى الرفيع</h3><div class="ins">استنتجْ من أحداثِ القصّةِ ثلاثَ صورٍ لإكرامِ الضيف، واكتبْها:</div>
     <div style="font-size:17px;font-weight:700;line-height:1.7">زارَ ضيفٌ بيتَكم، كيفَ تُكرمُه؟</div>
     <label for="w1">١.</label><input id="w1" type="text" autocomplete="off"><label for="w2">٢.</label><input id="w2" type="text" autocomplete="off"><label for="w3">٣.</label><input id="w3" type="text" autocomplete="off">
     <button class="btn primary check" type="button" data-l="w">تحقّقْ من إجاباتي</button><div class="res" id="r_w" role="status"></div></section>
   </div>
  </div>`;
  const pick={};
  book.querySelectorAll('.tf,.mc').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');pick[g.parentElement.dataset.k]=+b.dataset.v;play('turn');}));
  book.querySelectorAll('.check').forEach(btn=>btn.addEventListener('click',()=>{
    const l=btn.dataset.l, out=document.getElementById('r_'+l); let ok=0,tot=0;
    if(l==='tf'||l==='mc'){
      QUIZ[l].forEach((r,i)=>{tot++;const row=book.querySelector(`[data-k="${l}${i}"]`);const v=pick[l+i];const right= l==='tf' ? (v!==undefined && (!!v)===r.a) : v===r.a; row.classList.toggle('good',right);row.classList.toggle('bad',!right); if(right) ok++;});
    } else {
      const keys=[/رح[ّ]?ب|ترحيب|أهل|حيّ?ا/, /قهو|فنجان|دلّ?ة/, /طعا|غدا|أطعم|إطعام|خدم|أكل|ماء/];
      const vals=['w1','w2','w3'].map(id=>document.getElementById(id).value);
      const used=new Set(); tot=3;
      ['w1','w2','w3'].forEach(id=>{const el=document.getElementById(id);const ki=keys.findIndex((k,i)=>!used.has(i)&&k.test(el.value));const good=ki>-1;if(good){used.add(ki);ok++;}el.classList.toggle('good',good);el.classList.toggle('bad',!good);});
    }
    out.style.color = ok===tot ? 'var(--green)' : 'var(--red)';
    out.textContent = ok===tot ? `ممتاز! ${AR(ok)} من ${AR(tot)}` + (l==='w'?' (يراجعُ المعلّمُ إجابتك)':'') : `${AR(ok)} من ${AR(tot)} – راجعْ إجاباتِك وحاولْ مرّةً أخرى`;
    if(ok===tot && !answered['q'+l]){answered['q'+l]=true;stars++;setStars();play('correct');} else if(ok!==tot) play('wrong');
  }));
  book.querySelectorAll('.face').forEach(f=>f.addEventListener('click',()=>{book.querySelectorAll('.face').forEach(x=>x.setAttribute('aria-pressed','false'));f.setAttribute('aria-pressed','true');play('turn');}));
  updateNext(); nextBtn.firstChild.textContent='إنهاء ';
}
function renderEnd(){
  book.innerHTML = `<div class="end"><h2>أحسنتَ يا بطل!</h2><div class="bigstars">${Array.from({length:Math.max(stars,1)}).map(()=>STAR).join('')}</div>
   <p>جمعتَ ${AR(stars)} نجوم. تعلّمتَ مع سلمانَ كيف نُكرمُ الضيف، فإكرامُ الضيفِ من عاداتِنا الحميدةِ في مجتمعِنا البحرينيّ.</p>
   <button class="btn primary start" id="againBtn" type="button">اقرأ القصّةَ من جديد</button></div>`;
  document.getElementById('againBtn').addEventListener('click',()=>{stars=0;step={};for(const k in answered) delete answered[k];setStars();go(0);});
  play('win');
}
function go(i){ const back=i<idx; idx=Math.max(0,Math.min(PAGES.length-1,i)); if(back&&PAGES[idx].text) step[idx]=PAGES[idx].text.length; if(idx>0) play('turn'); render(); window.scrollTo({top:0,behavior:'smooth'}); }
prevBtn.addEventListener('click',()=>go(idx-1));
nextBtn.addEventListener('click',forward);
document.addEventListener('keydown',e=>{ if(e.target.matches('input')) return; if(e.key==='ArrowLeft'||e.key===' '){ e.preventDefault(); forward(); } if(e.key==='ArrowRight') go(idx-1); });
document.getElementById('sndBtn').addEventListener('click',e=>{soundOn=!soundOn;const b=e.currentTarget;b.setAttribute('aria-pressed',soundOn);b.querySelector('span').textContent='الأصوات: '+(soundOn?'تعمل':'متوقّفة');});
document.getElementById('fsBtn').addEventListener('click',()=>{const el=document.documentElement;try{ if(!document.fullscreenElement) el.requestFullscreen().catch(()=>flash('ملء الشاشة غير متاح هنا')); else document.exitFullscreen(); }catch(e){flash('ملء الشاشة غير متاح هنا');}});
render();
})();
</script>
